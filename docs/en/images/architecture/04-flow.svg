<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 486" width="960" height="486" role="img" aria-labelledby="title">
<title id="title">Inside one layout pass</title>
<style>
:root { --bg: #ffffff; --fg: #1c2230; --muted: #5a6476; --line: #b9c1cf; --panel: #f4f6f9;
  --accent: #2c4c8a; --accent-soft: #e3e9f5; --hot: #b8432a; --hot-soft: #f8e6e1; }
@media (prefers-color-scheme: dark) { :root { --bg: #1a2030; --fg: #e2e7f0; --muted: #9aa4b6; --line: #48526a; --panel: #141925;
  --accent: #8eaeea; --accent-soft: #1e2a44; --hot: #f08b6d; --hot-soft: #3a231e; } }
.bg { fill: var(--bg); }
text { fill: var(--fg); font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif; font-size: 12px; }
.t { font-weight: 700; font-size: 13px; }
.m { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11px; fill: var(--muted); }
.m.strong { fill: var(--fg); font-size: 12px; }
.s, .lab { font-size: 11px; fill: var(--muted); }
.labh { font-size: 11px; fill: var(--hot); }
.lane { font-size: 12px; font-weight: 700; fill: var(--accent); }
.colh, .gt { font-size: 12px; font-weight: 700; fill: var(--muted); }
.b { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
.k { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.4; }
.h { fill: var(--hot-soft); stroke: var(--hot); stroke-width: 1.5; }
.g { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 4; }
.g2 { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.lazy { fill: none; stroke: var(--hot); stroke-width: 1.2; stroke-dasharray: 4 3; }
.tree { fill: none; stroke: var(--line); stroke-width: 1.2; }
.wait { stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 3 4; }
.a { fill: none; stroke: var(--fg); stroke-width: 1.3; }
.a.dash { stroke-dasharray: 5 4; stroke: var(--muted); }
.a.hot { stroke: var(--hot); stroke-width: 1.5; }
.mk { fill: var(--fg); }
.mkh { fill: var(--hot); }
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mk"/></marker>
<marker id="mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkh"/></marker></defs>
<rect class="bg" x="0" y="0" width="960" height="486" rx="8"/>
<rect class="g" x="10" y="10" width="940" height="380" rx="10"/><text class="gt" x="24" y="30">One page-sequence (sequenceRun)</text><rect class="b" x="26" y="42" width="290" height="54" rx="6"/><text class="t" x="171" y="65.5" text-anchor="middle">Select the page master</text><text class="m" x="171" y="80.5" text-anchor="middle">selectMaster</text><rect class="b" x="331" y="42" width="290" height="54" rx="6"/><text class="t" x="476" y="65.5" text-anchor="middle">Open and close pages</text><text class="m" x="476" y="80.5" text-anchor="middle">openPage・closePage</text><rect class="b" x="636" y="42" width="298" height="54" rx="6"/><text class="t" x="785" y="65.5" text-anchor="middle">Place running heads and folios</text><text class="m" x="785" y="80.5" text-anchor="middle">sheetStatics</text><rect class="g2" x="26" y="110" width="908" height="112" rx="10"/><text class="gt" x="40" y="130">Flow: fill the page with the body</text><rect class="b" x="42" y="144" width="138" height="60" rx="6"/><text class="t" x="111" y="170.5" text-anchor="middle">Block</text><text class="m" x="111" y="185.5" text-anchor="middle">layoutBlock</text><rect class="b" x="190" y="144" width="138" height="60" rx="6"/><text class="t" x="259" y="170.5" text-anchor="middle">Table</text><text class="m" x="259" y="185.5" text-anchor="middle">layoutTable</text><rect class="b" x="338" y="144" width="138" height="60" rx="6"/><text class="t" x="407" y="170.5" text-anchor="middle">Float</text><text class="m" x="407" y="185.5" text-anchor="middle">placeFloat</text><rect class="b" x="486" y="144" width="138" height="60" rx="6"/><text class="t" x="555" y="170.5" text-anchor="middle">Footnote</text><text class="m" x="555" y="185.5" text-anchor="middle">footnotes</text><rect class="b" x="634" y="144" width="138" height="60" rx="6"/><text class="t" x="703" y="170.5" text-anchor="middle">Columns</text><text class="m" x="703" y="185.5" text-anchor="middle">layoutBoxColumns</text><rect class="b" x="782" y="144" width="138" height="60" rx="6"/><text class="t" x="851" y="170.5" text-anchor="middle">Absolute</text><text class="m" x="851" y="185.5" text-anchor="middle">placeAbsIn</text><polyline class="a  hot" points="476,110 476,98" marker-end="url(#mh)"/><text class="labh" x="484" y="106" text-anchor="start">overflow → next page</text><rect class="g2" x="26" y="238" width="908" height="138" rx="10"/><text class="gt" x="920" y="258" text-anchor="end">Build lines (inlineFlatten, inlineLayout)</text><rect class="b" x="42" y="272" width="192" height="88" rx="6"/><text class="t" x="138" y="305" text-anchor="middle">Flatten to atoms</text><text class="m" x="138" y="320" text-anchor="middle">flattenInline</text><text class="s" x="138" y="335" text-anchor="middle">ligatures, shaping, advances</text><rect class="h" x="270" y="272" width="192" height="88" rx="6"/><text class="t" x="366" y="305" text-anchor="middle">Break into lines</text><text class="m" x="366" y="320" text-anchor="middle">breakLines</text><text class="s" x="366" y="335" text-anchor="middle">UAX #14, kinsoku, hyphens</text><rect class="b" x="498" y="272" width="192" height="88" rx="6"/><text class="t" x="594" y="305" text-anchor="middle">Position in the line</text><text class="m" x="594" y="320" text-anchor="middle">positionLine</text><text class="s" x="594" y="335" text-anchor="middle">spacing, alignment, bidi</text><rect class="b" x="726" y="272" width="192" height="88" rx="6"/><text class="t" x="822" y="305" text-anchor="middle">Build the line node</text><text class="m" x="822" y="320" text-anchor="middle">buildLineNode</text><text class="s" x="822" y="335" text-anchor="middle">ruby, tate-chu-yoko</text><polyline class="a" points="234,316 268,316" marker-end="url(#m)"/><polyline class="a" points="462,316 496,316" marker-end="url(#m)"/><polyline class="a" points="690,316 724,316" marker-end="url(#m)"/><polyline class="a" points="111,204 111,270" marker-end="url(#m)"/><text class="lab" x="118" y="230" text-anchor="start">lines inside</text><rect class="b" x="150" y="410" width="230" height="60" rx="6"/><text class="t" x="265" y="436.5" text-anchor="middle">LNode tree</text><text class="s" x="265" y="451.5" text-anchor="middle">logical (inline, block)</text><rect class="b" x="420" y="410" width="180" height="60" rx="6"/><text class="t" x="510" y="436.5" text-anchor="middle">To physical</text><text class="m" x="510" y="451.5" text-anchor="middle">toArea・applyFlip</text><rect class="k" x="640" y="410" width="200" height="60" rx="6"/><text class="t" x="740" y="436.5" text-anchor="middle">Page areas</text><text class="m" x="740" y="451.5" text-anchor="middle">buildSheet</text><polyline class="a" points="265,390 265,408" marker-end="url(#m)"/><polyline class="a" points="380,440 418,440" marker-end="url(#m)"/><polyline class="a" points="600,440 638,440" marker-end="url(#m)"/>
</svg>
