<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="title">
<title id="title">Layout engine: lay out again until it converges</title>
<style>
:root { --bg: #ffffff; --fg: #1c2230; --muted: #5a6476; --line: #b9c1cf; --panel: #f4f6f9;
  --accent: #2c4c8a; --accent-soft: #e3e9f5; --hot: #b8432a; --hot-soft: #f8e6e1; }
@media (prefers-color-scheme: dark) { :root { --bg: #1a2030; --fg: #e2e7f0; --muted: #9aa4b6; --line: #48526a; --panel: #141925;
  --accent: #8eaeea; --accent-soft: #1e2a44; --hot: #f08b6d; --hot-soft: #3a231e; } }
.bg { fill: var(--bg); }
text { fill: var(--fg); font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif; font-size: 12px; }
.t { font-weight: 700; font-size: 13px; }
.m { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11px; fill: var(--muted); }
.m.strong { fill: var(--fg); font-size: 12px; }
.s, .lab { font-size: 11px; fill: var(--muted); }
.labh { font-size: 11px; fill: var(--hot); }
.lane { font-size: 12px; font-weight: 700; fill: var(--accent); }
.colh, .gt { font-size: 12px; font-weight: 700; fill: var(--muted); }
.b { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
.k { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.4; }
.h { fill: var(--hot-soft); stroke: var(--hot); stroke-width: 1.5; }
.g { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 4; }
.g2 { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.lazy { fill: none; stroke: var(--hot); stroke-width: 1.2; stroke-dasharray: 4 3; }
.tree { fill: none; stroke: var(--line); stroke-width: 1.2; }
.wait { stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 3 4; }
.a { fill: none; stroke: var(--fg); stroke-width: 1.3; }
.a.dash { stroke-dasharray: 5 4; stroke: var(--muted); }
.a.hot { stroke: var(--hot); stroke-width: 1.5; }
.mk { fill: var(--fg); }
.mkh { fill: var(--hot); }
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mk"/></marker>
<marker id="mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkh"/></marker></defs>
<rect class="bg" x="0" y="0" width="960" height="300" rx="8"/>
<rect class="b" x="250" y="24" width="180" height="52" rx="6"/><text class="t" x="340" y="46.5" text-anchor="middle">Previous pass</text><text class="m" x="340" y="61.5" text-anchor="middle">SeqMemo・LayoutReuse</text><rect class="b" x="450" y="24" width="180" height="52" rx="6"/><text class="t" x="540" y="46.5" text-anchor="middle">Lines across documents</text><text class="m" x="540" y="61.5" text-anchor="middle">SharedLineMemo</text><polyline class="a dash" points="345,76 420,148" marker-end="url(#m)"/><text class="lab" x="330" y="120" text-anchor="end">reuses unchanged sequences</text><polyline class="a dash" points="535,76 468,148" marker-end="url(#m)"/><text class="lab" x="548" y="120" text-anchor="start">with createTypesetter</text><rect class="k" x="20" y="150" width="110" height="60" rx="6"/><text class="t" x="75" y="176.5" text-anchor="middle">Logical tree</text><text class="m" x="75" y="191.5" text-anchor="middle">LDocument</text><rect class="b" x="160" y="150" width="160" height="60" rx="6"/><text class="t" x="240" y="176.5" text-anchor="middle">Number the nodes</text><text class="m" x="240" y="191.5" text-anchor="middle">indexDocument</text><rect class="h" x="350" y="150" width="180" height="60" rx="6"/><text class="t" x="440" y="176.5" text-anchor="middle">Lay out once</text><text class="m" x="440" y="191.5" text-anchor="middle">layoutOnce → PageBuild</text><rect class="b" x="570" y="150" width="170" height="60" rx="6"/><text class="t" x="655" y="176.5" text-anchor="middle">Converged?</text><text class="s" x="655" y="191.5" text-anchor="middle">page count, cited values</text><rect class="k" x="780" y="150" width="160" height="60" rx="6"/><text class="t" x="860" y="176.5" text-anchor="middle">Build area tree</text><text class="m" x="860" y="191.5" text-anchor="middle">finishTree</text><polyline class="a" points="130,180 158,180" marker-end="url(#m)"/><polyline class="a" points="320,180 348,180" marker-end="url(#m)"/><polyline class="a" points="530,180 568,180" marker-end="url(#m)"/><polyline class="a" points="740,180 778,180" marker-end="url(#m)"/><text class="lab" x="760" y="170" text-anchor="middle">yes</text><polyline class="a  hot" points="655,210 655,252 440,252 440,212" marker-end="url(#mh)"/><text class="labh" x="548" y="272" text-anchor="middle">changed → lay out again (up to 4 times)</text>
</svg>
