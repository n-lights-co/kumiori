<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title">
<title id="title">Images and drawings: detect the format, then pixels or shapes</title>
<style>
:root { --bg: #ffffff; --fg: #1c2230; --muted: #5a6476; --line: #b9c1cf; --panel: #f4f6f9;
  --accent: #2c4c8a; --accent-soft: #e3e9f5; --hot: #b8432a; --hot-soft: #f8e6e1; }
@media (prefers-color-scheme: dark) { :root { --bg: #1a2030; --fg: #e2e7f0; --muted: #9aa4b6; --line: #48526a; --panel: #141925;
  --accent: #8eaeea; --accent-soft: #1e2a44; --hot: #f08b6d; --hot-soft: #3a231e; } }
.bg { fill: var(--bg); }
text { fill: var(--fg); font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif; font-size: 12px; }
.t { font-weight: 700; font-size: 13px; }
.m { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11px; fill: var(--muted); }
.m.strong { fill: var(--fg); font-size: 12px; }
.s, .lab { font-size: 11px; fill: var(--muted); }
.labh { font-size: 11px; fill: var(--hot); }
.lane { font-size: 12px; font-weight: 700; fill: var(--accent); }
.colh, .gt { font-size: 12px; font-weight: 700; fill: var(--muted); }
.b { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
.k { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.4; }
.h { fill: var(--hot-soft); stroke: var(--hot); stroke-width: 1.5; }
.g { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 4; }
.g2 { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.lazy { fill: none; stroke: var(--hot); stroke-width: 1.2; stroke-dasharray: 4 3; }
.tree { fill: none; stroke: var(--line); stroke-width: 1.2; }
.wait { stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 3 4; }
.a { fill: none; stroke: var(--fg); stroke-width: 1.3; }
.a.dash { stroke-dasharray: 5 4; stroke: var(--muted); }
.a.hot { stroke: var(--hot); stroke-width: 1.5; }
.mk { fill: var(--fg); }
.mkh { fill: var(--hot); }
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mk"/></marker>
<marker id="mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkh"/></marker></defs>
<rect class="bg" x="0" y="0" width="960" height="400" rx="8"/>
<rect class="b" x="20" y="60" width="170" height="56" rx="6"/><text class="t" x="105" y="84.5" text-anchor="middle">Given files</text><text class="m" x="105" y="99.5" text-anchor="middle">files・Blob</text><rect class="b" x="20" y="140" width="170" height="56" rx="6"/><text class="t" x="105" y="164.5" text-anchor="middle">Fetched references</text><text class="m" x="105" y="179.5" text-anchor="middle">resolveResource・fetch</text><polyline class="a" points="190,88 214,88 214,128 238,128" marker-end="url(#m)"/><polyline class="a" points="190,168 214,168 214,128" marker-end="url(#m)"/><text class="lab" x="105" y="222" text-anchor="middle">size and time limits on fetches</text><rect class="h" x="240" y="90" width="170" height="76" rx="6"/><text class="t" x="325" y="117" text-anchor="middle">Image store</text><text class="m" x="325" y="132" text-anchor="middle">AssetStore</text><text class="s" x="325" y="147" text-anchor="middle">reads the size first</text><rect class="b" x="450" y="90" width="160" height="76" rx="6"/><text class="t" x="530" y="117" text-anchor="middle">Detect format</text><text class="m" x="530" y="132" text-anchor="middle">plugins → draw.io</text><text class="s" x="530" y="147" text-anchor="middle">→ built-in formats</text><polyline class="a" points="410,128 448,128" marker-end="url(#m)"/><rect class="g" x="650" y="10" width="290" height="150" rx="10"/><text class="gt" x="664" y="30">To pixels</text><text class="li" x="666" y="56" text-anchor="start">JPEG (jpeg)</text><text class="li" x="666" y="80" text-anchor="start">PNG (pako)</text><text class="li" x="666" y="104" text-anchor="start">WebP (webp・vp8)</text><text class="li" x="666" y="128" text-anchor="start">GIF・BMP (pixels)</text><text class="li" x="806" y="56" text-anchor="start">TIFF (utif・ccitt)</text><rect class="g" x="650" y="176" width="290" height="190" rx="10"/><text class="gt" x="664" y="196">To shapes</text><text class="li" x="666" y="222" text-anchor="start">SVG (svg・svgFilterRaster)</text><text class="li" x="666" y="246" text-anchor="start">MathML (mathLayout)</text><text class="li" x="666" y="270" text-anchor="start">PDF pages (pdfImage)</text><text class="li" x="666" y="294" text-anchor="start">EPS (psInterp)</text><text class="li" x="666" y="318" text-anchor="start">WMF・EMF (metafile)・CGM</text><text class="li" x="666" y="342" text-anchor="start">draw.io (drawio/)</text><rect class="lazy" x="656" y="278" width="270" height="74" rx="6"/><text class="labh" x="940" y="386" text-anchor="end">Formats in the dashed box load their code only when used</text><polyline class="a" points="610,116 648,86" marker-end="url(#m)"/><polyline class="a" points="610,140 648,260" marker-end="url(#m)"/><rect class="k" x="240" y="260" width="170" height="64" rx="6"/><text class="t" x="325" y="288.5" text-anchor="middle">Layout and rendering</text><text class="s" x="325" y="303.5" text-anchor="middle">natural size, content</text><polyline class="a" points="325,166 325,258" marker-end="url(#m)"/><text class="lab" x="333" y="220" text-anchor="start">one shared image</text>
</svg>
