s="b" x="610" y="264" width="320" height="56" rx="6"/><text class="t" x="770" y="288.5" text-anchor="middle">Read attributes, build logical tree</text><text class="m" x="770" y="303.5" text-anchor="middle">xslfoImport・foExpr・foPageMaster</text><polyline class="a" points="590,292 608,292" marker-end="url(#m)"/><polyline class="a" points="354,160 354,78 438,78" marker-end="url(#m)"/><text class="lab" x="362" y="120" text-anchor="start">html・xhtml</text><polyline class="a" points="354,210 354,292 438,292" marker-end="url(#m)"/><text class="lab" x="362" y="254" text-anchor="start">fo</text><rect class="k" x="960" y="150" width="100" height="70" rx="6"/><text class="t" x="1010" y="181.5" text-anchor="middle">Logical tree</text><text class="m" x="1010" y="196.5" text-anchor="middle">LDocument</text><polyline class="a" points="930,78 990,78 990,148" marker-end="url(#m)"/><polyline class="a" points="930,292 990,292 990,222" marker-end="url(#m)"/><rect class="h" x="800" y="350" width="260" height="56" rx="6"/><text class="t" x="930" y="374.5" text-anchor="middle">Load fonts for the characters used</text><text class="s" x="930" y="389.5" text-anchor="middle">mono, symbol, emoji, math, OS fonts</text><polyline class="a" points="1040,220 1040,348" marker-end="url(#m)"/><polyline class="a" points="800,378 720,378" marker-end="url(#m)"/><text class="lab" x="712" y="382" text-anchor="end">to layout (figure 3)</text>
