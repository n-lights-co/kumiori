<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-labelledby="title">
<title id="title">Call context: restore it after every await</title>
<style>
:root { --bg: #ffffff; --fg: #1c2230; --muted: #5a6476; --line: #b9c1cf; --panel: #f4f6f9;
  --accent: #2c4c8a; --accent-soft: #e3e9f5; --hot: #b8432a; --hot-soft: #f8e6e1; }
@media (prefers-color-scheme: dark) { :root { --bg: #1a2030; --fg: #e2e7f0; --muted: #9aa4b6; --line: #48526a; --panel: #141925;
  --accent: #8eaeea; --accent-soft: #1e2a44; --hot: #f08b6d; --hot-soft: #3a231e; } }
.bg { fill: var(--bg); }
text { fill: var(--fg); font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif; font-size: 12px; }
.t { font-weight: 700; font-size: 13px; }
.m { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11px; fill: var(--muted); }
.m.strong { fill: var(--fg); font-size: 12px; }
.s, .lab { font-size: 11px; fill: var(--muted); }
.labh { font-size: 11px; fill: var(--hot); }
.lane { font-size: 12px; font-weight: 700; fill: var(--accent); }
.colh, .gt { font-size: 12px; font-weight: 700; fill: var(--muted); }
.b { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
.k { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.4; }
.h { fill: var(--hot-soft); stroke: var(--hot); stroke-width: 1.5; }
.g { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 4; }
.g2 { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.lazy { fill: none; stroke: var(--hot); stroke-width: 1.2; stroke-dasharray: 4 3; }
.tree { fill: none; stroke: var(--line); stroke-width: 1.2; }
.wait { stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 3 4; }
.a { fill: none; stroke: var(--fg); stroke-width: 1.3; }
.a.dash { stroke-dasharray: 5 4; stroke: var(--muted); }
.a.hot { stroke: var(--hot); stroke-width: 1.5; }
.mk { fill: var(--fg); }
.mkh { fill: var(--hot); }
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mk"/></marker>
<marker id="mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkh"/></marker></defs>
<rect class="bg" x="0" y="0" width="960" height="250" rx="8"/>
<text class="lane" x="20" y="34" text-anchor="start">Module variable</text><rect class="k" x="160" y="18" width="160" height="26" rx="4"/><text class="t" x="240" y="36" text-anchor="middle">A</text><rect class="h" x="320" y="18" width="180" height="26" rx="4"/><text class="t" x="410" y="36" text-anchor="middle">B</text><rect class="k" x="500" y="18" width="180" height="26" rx="4"/><text class="t" x="590" y="36" text-anchor="middle">A</text><rect class="h" x="680" y="18" width="200" height="26" rx="4"/><text class="t" x="780" y="36" text-anchor="middle">B</text><text class="lane" x="20" y="104" text-anchor="start">typeset A</text><rect class="b" x="160" y="80" width="150" height="40" rx="6"/><text class="t" x="235" y="104" text-anchor="middle">Start</text><line class="wait" x1="310" y1="100" x2="500" y2="100"/><text class="lab" x="405" y="92" text-anchor="middle">await (fetch fonts)</text><rect class="k" x="500" y="80" width="180" height="40" rx="6"/><text class="t" x="590" y="104" text-anchor="middle">rejoin → back to A</text><text class="lane" x="20" y="184" text-anchor="start">typeset B</text><rect class="b" x="320" y="160" width="170" height="40" rx="6"/><text class="t" x="405" y="184" text-anchor="middle">Start</text><line class="wait" x1="490" y1="180" x2="680" y2="180"/><text class="lab" x="585" y="172" text-anchor="middle">await</text><rect class="h" x="680" y="160" width="190" height="40" rx="6"/><text class="t" x="775" y="184" text-anchor="middle">rejoin → back to B</text><polyline class="a" points="160,226 940,226" marker-end="url(#m)"/><text class="lab" x="940" y="244" text-anchor="end">time</text>
</svg>
