ss="a" points="380,48 418,48" marker-end="url(#m)"/><polyline class="a" points="380,128 418,128" marker-end="url(#m)"/><polyline class="a" points="380,208 418,208" marker-end="url(#m)"/><polyline class="a" points="380,288 418,288" marker-end="url(#m)"/><rect class="g" x="670" y="10" width="270" height="350" rx="10"/><text class="gt" x="684" y="30">Checks</text><rect class="b" x="686" y="40" width="238" height="64" rx="6"/><text class="t" x="805" y="61" text-anchor="middle">Unit tests</text><text class="m" x="805" y="76" text-anchor="middle">vitest (test/)</text><text class="s" x="805" y="91" text-anchor="middle">plus area tree fingerprints</text><rect class="b" x="686" y="120" width="238" height="64" rx="6"/><text class="t" x="805" y="148.5" text-anchor="middle">Browser tests</text><text class="m" x="805" y="163.5" text-anchor="middle">Playwright (e2e/)</text><rect class="h" x="686" y="200" width="238" height="64" rx="6"/><text class="t" x="805" y="221" text-anchor="middle">Before/after comparison</text><text class="m" x="805" y="236" text-anchor="middle">compare-base・perf-compare</text><text class="s" x="805" y="251" text-anchor="middle">checked against intended changes</text><rect class="b" x="686" y="280" width="238" height="64" rx="6"/><text class="t" x="805" y="308.5" text-anchor="middle">CI steps locally</text><text class="m" x="805" y="323.5" text-anchor="middle">npm run ci:local</text>
