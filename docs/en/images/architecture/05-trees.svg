<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title">
<title id="title">The logical tree and the area tree</title>
<style>
:root { --bg: #ffffff; --fg: #1c2230; --muted: #5a6476; --line: #b9c1cf; --panel: #f4f6f9;
  --accent: #2c4c8a; --accent-soft: #e3e9f5; --hot: #b8432a; --hot-soft: #f8e6e1; }
@media (prefers-color-scheme: dark) { :root { --bg: #1a2030; --fg: #e2e7f0; --muted: #9aa4b6; --line: #48526a; --panel: #141925;
  --accent: #8eaeea; --accent-soft: #1e2a44; --hot: #f08b6d; --hot-soft: #3a231e; } }
.bg { fill: var(--bg); }
text { fill: var(--fg); font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif; font-size: 12px; }
.t { font-weight: 700; font-size: 13px; }
.m { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11px; fill: var(--muted); }
.m.strong { fill: var(--fg); font-size: 12px; }
.s, .lab { font-size: 11px; fill: var(--muted); }
.labh { font-size: 11px; fill: var(--hot); }
.lane { font-size: 12px; font-weight: 700; fill: var(--accent); }
.colh, .gt { font-size: 12px; font-weight: 700; fill: var(--muted); }
.b { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
.k { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.4; }
.h { fill: var(--hot-soft); stroke: var(--hot); stroke-width: 1.5; }
.g { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 4; }
.g2 { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.lazy { fill: none; stroke: var(--hot); stroke-width: 1.2; stroke-dasharray: 4 3; }
.tree { fill: none; stroke: var(--line); stroke-width: 1.2; }
.wait { stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 3 4; }
.a { fill: none; stroke: var(--fg); stroke-width: 1.3; }
.a.dash { stroke-dasharray: 5 4; stroke: var(--muted); }
.a.hot { stroke: var(--hot); stroke-width: 1.5; }
.mk { fill: var(--fg); }
.mkh { fill: var(--hot); }
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mk"/></marker>
<marker id="mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkh"/></marker></defs>
<rect class="bg" x="0" y="0" width="960" height="400" rx="8"/>
<text class="lane" x="20" y="24" text-anchor="start">Logical tree (input)</text><text class="lane" x="520" y="24" text-anchor="start">Area tree (physical)</text><rect class="b" x="20" y="40" width="420" height="36" rx="6"/><text class="m strong" x="32" y="63">LDocument</text><rect class="b" x="42" y="90" width="398" height="36" rx="6"/><text class="m strong" x="54" y="113">LPageSequence</text><text class="s" x="428" y="113" text-anchor="end">page masters</text><polyline class="tree" points="30,76 30,108 42,108"/><rect class="b" x="64" y="140" width="376" height="36" rx="6"/><text class="m strong" x="76" y="163">LFlow</text><text class="s" x="428" y="163" text-anchor="end">body, static content</text><polyline class="tree" points="52,126 52,158 64,158"/><rect class="b" x="86" y="190" width="354" height="36" rx="6"/><text class="m strong" x="98" y="213">LBlock・LTable・LBlockContainer</text><polyline class="tree" points="74,176 74,208 86,208"/><rect class="b" x="86" y="240" width="354" height="36" rx="6"/><text class="m strong" x="98" y="263">LFloat・LFootnote・LMarker</text><polyline class="tree" points="74,176 74,258 86,258"/><rect class="b" x="108" y="290" width="332" height="36" rx="6"/><text class="m strong" x="120" y="313">LInline・LRuby・LTateChuYoko</text><polyline class="tree" points="96,276 96,308 108,308"/><rect class="b" x="108" y="340" width="332" height="36" rx="6"/><text class="m strong" x="120" y="363">text・LImage・LLeader</text><polyline class="tree" points="96,276 96,358 108,358"/><rect class="b" x="520" y="40" width="420" height="36" rx="6"/><text class="m strong" x="532" y="63">AreaTree</text><text class="s" x="928" y="63" text-anchor="end">bookmarks, links, structure</text><rect class="b" x="542" y="90" width="398" height="36" rx="6"/><text class="m strong" x="554" y="113">sheet</text><text class="s" x="928" y="113" text-anchor="end">crop marks, bleed</text><polyline class="tree" points="530,76 530,108 542,108"/><rect class="b" x="564" y="140" width="376" height="36" rx="6"/><text class="m strong" x="576" y="163">page</text><polyline class="tree" points="552,126 552,158 564,158"/><rect class="b" x="586" y="190" width="354" height="36" rx="6"/><text class="m strong" x="598" y="213">region-body</text><text class="s" x="928" y="213" text-anchor="end">plus behind, absolute</text><polyline class="tree" points="574,176 574,208 586,208"/><rect class="b" x="608" y="240" width="332" height="36" rx="6"/><text class="m strong" x="620" y="263">block・table・table-cell</text><polyline class="tree" points="596,226 596,258 608,258"/><rect class="b" x="630" y="290" width="310" height="36" rx="6"/><text class="m strong" x="642" y="313">line</text><polyline class="tree" points="618,276 618,308 630,308"/><rect class="b" x="652" y="340" width="288" height="36" rx="6"/><text class="m strong" x="664" y="363">glyph・image・ruby・inline</text><polyline class="tree" points="640,326 640,358 652,358"/><polyline class="a  hot" points="440,108 540,108" marker-end="url(#mh)"/><text class="labh" x="480" y="102" text-anchor="middle">one per page</text><polyline class="a  hot" points="440,208 606,258" marker-end="url(#mh)"/><text class="labh" x="446" y="278" text-anchor="start">split at page breaks</text><polyline class="a  hot" points="440,358 650,358" marker-end="url(#mh)"/><text class="labh" x="546" y="350" text-anchor="middle">lines, one area per glyph</text>
</svg>
