<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" role="img" aria-labelledby="title">
<title id="title">描画: 1 つの走査、4 つの書き出し</title>
<style>
:root { --bg: #ffffff; --fg: #1c2230; --muted: #5a6476; --line: #b9c1cf; --panel: #f4f6f9;
  --accent: #2c4c8a; --accent-soft: #e3e9f5; --hot: #b8432a; --hot-soft: #f8e6e1; }
@media (prefers-color-scheme: dark) { :root { --bg: #1a2030; --fg: #e2e7f0; --muted: #9aa4b6; --line: #48526a; --panel: #141925;
  --accent: #8eaeea; --accent-soft: #1e2a44; --hot: #f08b6d; --hot-soft: #3a231e; } }
.bg { fill: var(--bg); }
text { fill: var(--fg); font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif; font-size: 12px; }
.t { font-weight: 700; font-size: 13px; }
.m { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11px; fill: var(--muted); }
.m.strong { fill: var(--fg); font-size: 12px; }
.s, .lab { font-size: 11px; fill: var(--muted); }
.labh { font-size: 11px; fill: var(--hot); }
.lane { font-size: 12px; font-weight: 700; fill: var(--accent); }
.colh, .gt { font-size: 12px; font-weight: 700; fill: var(--muted); }
.b { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
.k { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.4; }
.h { fill: var(--hot-soft); stroke: var(--hot); stroke-width: 1.5; }
.g { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 4; }
.g2 { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.lazy { fill: none; stroke: var(--hot); stroke-width: 1.2; stroke-dasharray: 4 3; }
.tree { fill: none; stroke: var(--line); stroke-width: 1.2; }
.wait { stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 3 4; }
.a { fill: none; stroke: var(--fg); stroke-width: 1.3; }
.a.dash { stroke-dasharray: 5 4; stroke: var(--muted); }
.a.hot { stroke: var(--hot); stroke-width: 1.5; }
.mk { fill: var(--fg); }
.mkh { fill: var(--hot); }
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mk"/></marker>
<marker id="mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkh"/></marker></defs>
<rect class="bg" x="0" y="0" width="960" height="370" rx="8"/>
<rect class="k" x="20" y="150" width="130" height="60" rx="6"/><text class="t" x="85" y="176.5" text-anchor="middle">Area Tree</text><text class="m" x="85" y="191.5" text-anchor="middle">AreaTree</text><rect class="h" x="180" y="120" width="190" height="120" rx="6"/><text class="t" x="275" y="169" text-anchor="middle">走査と描く順</text><text class="m" x="275" y="184" text-anchor="middle">paintSheet・paintArea</text><text class="s" x="275" y="199" text-anchor="middle">背景・罫線・中身・トンボ</text><polyline class="a" points="150,180 178,180" marker-end="url(#m)"/><rect class="k" x="400" y="30" width="34" height="304" rx="6"/><text class="t" transform="translate(422 182) rotate(-90)" text-anchor="middle">Painter インターフェース</text><polyline class="a" points="370,180 398,180" marker-end="url(#m)"/><rect class="b" x="470" y="30" width="210" height="64" rx="6"/><text class="t" x="575" y="51" text-anchor="middle">Canvas (画面)</text><text class="m" x="575" y="66" text-anchor="middle">canvasRenderer</text><text class="m" x="575" y="81" text-anchor="middle">renderPage</text><rect class="b" x="470" y="110" width="210" height="64" rx="6"/><text class="t" x="575" y="131" text-anchor="middle">SVG</text><text class="m" x="575" y="146" text-anchor="middle">svgRenderer</text><text class="m" x="575" y="161" text-anchor="middle">renderPageToSvg</text><rect class="b" x="470" y="190" width="210" height="64" rx="6"/><text class="t" x="575" y="211" text-anchor="middle">PNG (自前で塗る)</text><text class="m" x="575" y="226" text-anchor="middle">pageRaster</text><text class="m" x="575" y="241" text-anchor="middle">renderPageToPng</text><rect class="k" x="470" y="270" width="210" height="64" rx="6"/><text class="t" x="575" y="291" text-anchor="middle">PDF</text><text class="m" x="575" y="306" text-anchor="middle">pdfRenderer (pdf-lib)</text><text class="m" x="575" y="321" text-anchor="middle">toPdf・typesetToPdf</text><polyline class="a" points="434,62 468,62" marker-end="url(#m)"/><polyline class="a" points="434,142 468,142" marker-end="url(#m)"/><polyline class="a" points="434,222 468,222" marker-end="url(#m)"/><polyline class="a" points="434,302 468,302" marker-end="url(#m)"/><rect class="g" x="710" y="120" width="230" height="236" rx="10"/><text class="gt" x="724" y="140">PDF だけの部品</text><text class="li" x="726" y="166" text-anchor="start">書体の埋め込み (fontkit)</text><text class="li" x="726" y="193" text-anchor="start">色つきの字形 (colorGlyphPdf)</text><text class="li" x="726" y="220" text-anchor="start">画像の埋め込み (pdfImageEmbed)</text><text class="li" x="726" y="247" text-anchor="start">タグ付き PDF (pdfTags)</text><text class="li" x="726" y="274" text-anchor="start">PDF/X・PDF/A (pdfStandard)</text><text class="li" x="726" y="301" text-anchor="start">透明の平坦化 (pdfFlatten)</text><text class="li" x="726" y="328" text-anchor="start">ページラベル (pdfPageLabels)</text><polyline class="a" points="680,302 708,302" marker-end="url(#m)"/>
</svg>
