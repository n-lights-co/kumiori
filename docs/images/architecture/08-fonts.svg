<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="title">
<title id="title">書体: どこから来て、誰が使うか</title>
<style>
:root { --bg: #ffffff; --fg: #1c2230; --muted: #5a6476; --line: #b9c1cf; --panel: #f4f6f9;
  --accent: #2c4c8a; --accent-soft: #e3e9f5; --hot: #b8432a; --hot-soft: #f8e6e1; }
@media (prefers-color-scheme: dark) { :root { --bg: #1a2030; --fg: #e2e7f0; --muted: #9aa4b6; --line: #48526a; --panel: #141925;
  --accent: #8eaeea; --accent-soft: #1e2a44; --hot: #f08b6d; --hot-soft: #3a231e; } }
.bg { fill: var(--bg); }
text { fill: var(--fg); font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif; font-size: 12px; }
.t { font-weight: 700; font-size: 13px; }
.m { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11px; fill: var(--muted); }
.m.strong { fill: var(--fg); font-size: 12px; }
.s, .lab { font-size: 11px; fill: var(--muted); }
.labh { font-size: 11px; fill: var(--hot); }
.lane { font-size: 12px; font-weight: 700; fill: var(--accent); }
.colh, .gt { font-size: 12px; font-weight: 700; fill: var(--muted); }
.b { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
.k { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.4; }
.h { fill: var(--hot-soft); stroke: var(--hot); stroke-width: 1.5; }
.g { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 4; }
.g2 { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.lazy { fill: none; stroke: var(--hot); stroke-width: 1.2; stroke-dasharray: 4 3; }
.tree { fill: none; stroke: var(--line); stroke-width: 1.2; }
.wait { stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 3 4; }
.a { fill: none; stroke: var(--fg); stroke-width: 1.3; }
.a.dash { stroke-dasharray: 5 4; stroke: var(--muted); }
.a.hot { stroke: var(--hot); stroke-width: 1.5; }
.mk { fill: var(--fg); }
.mkh { fill: var(--hot); }
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mk"/></marker>
<marker id="mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mkh"/></marker></defs>
<rect class="bg" x="0" y="0" width="960" height="380" rx="8"/>
<text class="lane" x="20" y="24" text-anchor="start">書体の出どころ</text><rect class="b" x="20" y="36" width="200" height="56" rx="6"/><text class="t" x="120" y="60.5" text-anchor="middle">既定の書体</text><text class="m" x="120" y="75.5" text-anchor="middle">DEFAULT_FONTS・loadFont</text><rect class="b" x="20" y="108" width="200" height="56" rx="6"/><text class="t" x="120" y="132.5" text-anchor="middle">渡されたファイル</text><text class="m" x="120" y="147.5" text-anchor="middle">files・@font-face</text><rect class="b" x="20" y="180" width="200" height="56" rx="6"/><text class="t" x="120" y="204.5" text-anchor="middle">OS の書体</text><text class="m" x="120" y="219.5" text-anchor="middle">systemFonts (Node)</text><rect class="b" x="20" y="252" width="200" height="56" rx="6"/><text class="t" x="120" y="276.5" text-anchor="middle">画面で読み込んだ書体</text><text class="m" x="120" y="291.5" text-anchor="middle">userFonts</text><rect class="b" x="260" y="130" width="170" height="80" rx="6"/><text class="t" x="345" y="159" text-anchor="middle">形を戻す・分ける</text><text class="m" x="345" y="174" text-anchor="middle">webFont・fontLoader</text><text class="s" x="345" y="189" text-anchor="middle">WOFF2 → TTF・TTC の分割</text><polyline class="a" points="220,64 240,64 240,160 258,160" marker-end="url(#m)"/><polyline class="a" points="220,136 240,136" marker-end="url(#m)"/><polyline class="a" points="220,208 240,208 240,180 258,180" marker-end="url(#m)"/><polyline class="a" points="220,280 240,280 240,208" marker-end="url(#m)"/><rect class="h" x="470" y="120" width="190" height="100" rx="6"/><text class="t" x="565" y="151.5" text-anchor="middle">FontManager</text><text class="m" x="565" y="166.5" text-anchor="middle">registerBuffer</text><text class="s" x="565" y="181.5" text-anchor="middle">fontkit で読む</text><text class="s" x="565" y="196.5" text-anchor="middle">字の割り当て</text><polyline class="a" points="430,170 468,170" marker-end="url(#m)"/><rect class="b" x="455" y="270" width="220" height="64" rx="6"/><text class="t" x="565" y="298.5" text-anchor="middle">可変フォントの実体</text><text class="m" x="565" y="313.5" text-anchor="middle">fontInstancer・cff2Instancer</text><polyline class="a" points="565,220 565,268" marker-end="url(#m)" marker-start="url(#m)"/><text class="lab" x="573" y="250" text-anchor="start">軸の値を決める</text><rect class="b" x="470" y="20" width="190" height="64" rx="6"/><text class="t" x="565" y="48.5" text-anchor="middle">書体の割り当て</text><text class="m" x="565" y="63.5" text-anchor="middle">fontMapping</text><polyline class="a" points="565,84 565,118" marker-end="url(#m)"/><text class="lab" x="573" y="106" text-anchor="start">family → 書体</text><text class="lane" x="720" y="24" text-anchor="start">使う側</text><rect class="k" x="720" y="36" width="220" height="64" rx="6"/><text class="t" x="830" y="57" text-anchor="middle">計測 (組版)</text><text class="m" x="830" y="72" text-anchor="middle">Measurer・fontkitShaping</text><text class="s" x="830" y="87" text-anchor="middle">送り・GSUB・GPOS</text><rect class="b" x="720" y="140" width="220" height="56" rx="6"/><text class="t" x="830" y="164.5" text-anchor="middle">Canvas</text><text class="m" x="830" y="179.5" text-anchor="middle">FontFace</text><rect class="b" x="720" y="236" width="220" height="56" rx="6"/><text class="t" x="830" y="260.5" text-anchor="middle">PDF・SVG・PNG</text><text class="s" x="830" y="275.5" text-anchor="middle">字形の輪郭・埋め込み</text><polyline class="a" points="660,150 690,150 690,68 718,68" marker-end="url(#m)"/><polyline class="a" points="660,168 718,168" marker-end="url(#m)"/><polyline class="a" points="660,186 690,186 690,264 718,264" marker-end="url(#m)"/><text class="lab" x="720" y="330" text-anchor="start">文書が使うときだけ読む:</text><text class="lab" x="720" y="348" text-anchor="start">数式・等幅・記号・絵文字</text>
</svg>
