<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>組み織りの本の見本</title>
<style>
@page { size: A5; margin: 20mm 15mm 18mm;
  @bottom-center { content: counter(page) " / " counter(pages); font-size: 8pt; } }
@page :left { @top-left { content: string(book); font-size: 8pt; border-bottom: 0.5pt solid #888; } }
@page :right { @top-right { content: element(runhead); font-size: 8pt; border-bottom: 0.5pt solid #888; } }
@page :first { @bottom-center { content: none; } }
@page cover { margin: 30mm; @bottom-center { content: none; } }
.cover { page: cover; text-align: center; }
.cover h1 { string-set: book content(); font-size: 20pt; }
body { counter-reset: chapter; }
h2 { counter-increment: chapter; break-before: page; string-set: chapter content(); }
h2::before { content: "第" counter(chapter, cjk-decimal) "章　"; }
.runhead { position: running(runhead); }
.fn { float: footnote; }
.toc a { text-decoration: none; color: inherit; }
.toc a::after { content: leader(dotted) target-counter(attr(href), page); }
.toc li { list-style: none; }
p { text-indent: 1em; margin: 0; }
</style>
</head>
<body>

</body>
</html>
