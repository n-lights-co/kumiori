<h1>縦書きの見本</h1>
<p>組み織りは縦書きも組めます。平成<span class="tcy">12</span>年<span class="tcy">3</span>月に、<ruby>組版<rt>くみはん</rt></ruby>の規則を整えました。行頭・行末の禁則と、句読点のぶら下げに従います。</p>
<p>二つ目の段落です。「かぎ括弧」や（丸括弧）の約物も、縦書きの字形で組みます。</p>
