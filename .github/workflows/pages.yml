# 画面 (ブラウザで動く Kumiori) を GitHub Pages に置く。main に push するたびに作り直す。
# リポジトリの Settings → Pages で、Source を「GitHub Actions」にしておく (docs/RELEASING.md)
# 非公開のリポジトリの間は、配置 (deploy) を飛ばす (無料のプランでは非公開のリポジトリの Pages を有効にできず、配置が 404 で失敗するため)。
# ビルド (build) は毎回走らせ、画面のビルドが壊れていないことは確かめる。公開にすれば、そのまま配置される
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 既定は読むだけ。Pages へ置く権限 (pages・id-token) は、置くジョブ (deploy) だけに渡す (依存を入れてビルドするジョブには渡さない)
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 置かれる URL は https://<アカウント>.github.io/<リポジトリ名>/ なので、アセットのパスの土台 (base) をリポジトリ名にする
      # (<アカウント>.github.io という名前のリポジトリなら、土台は /)
      - name: Build
        # リポジトリ名は、スクリプトに直接は埋めず、環境変数で渡す
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          case "$REPO" in *.github.io) BASE="/" ;; *) BASE="/$REPO/" ;; esac
          npx vite build --base="$BASE"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    # 公開のリポジトリのときだけ配置する (非公開の間は「skipped」と表示される)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      # Pages への配置の認証 (OIDC) に要る
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
