# npm に公開する。タグ v<版> を push したときに動く (docs/RELEASING.md の「版を出すたびに」)。
# npm の Trusted Publishing (OIDC) で認証するので、npm のトークンは保管しない。
# npm のパッケージの設定 (Settings → Trusted Publisher) に、このリポジトリ・このファイルの名前 (publish.yml)・環境の名前 (npm) を登録しておく。
# 来歴 (provenance) は Trusted Publishing で自動で付く。
# Trusted Publishing には npm 11.5.1 以上・Node 22.14.0 以上・GitHub のホストのランナーが要る
name: Publish

on:
  push:
    tags: ['v*']

# 既定は読むだけ。npm へ公開する権限 (id-token) は、公開するジョブ (publish) だけに渡す
permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # 検査とビルドをして、公開する tarball を作る。依存の install スクリプトや開発用の依存 (テスト) が走るので、
  # このジョブには公開の権限を渡さない
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # タグが main の上にあるかを確かめるため、main の履歴も取る
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      # タグ (v0.1.1 など) が package.json の version と同じで、main に入ったコミットを指していること
      - name: タグと版の確認
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::タグ $GITHUB_REF_NAME が package.json の版 $version と違う"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::タグ $GITHUB_REF_NAME のコミットが main に入っていない"
            exit 1
          fi
      - run: npm ci
      - uses: actions/cache@v5
        with:
          path: .cache/fonts
          # ci.yml の build と同じ (テストが取得する書体。キーは、書体の一覧の載るファイルのハッシュ。ci.yml が保存したキャッシュを使える)
          key: fonts-test-${{ hashFiles('src/fontMapping.ts', 'test/helpers.ts', 'scripts/conformance-fonts.mjs') }}
          restore-keys: |
            fonts-test-
            fonts-defaults-v1
      # prepublishOnly と同じ検査とビルド (型検査・テスト・3 つのビルド)
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:dist
      # 公開する tarball。スクリプトは走らせない (上で済ませた)
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: kumiori-*.tgz
          if-no-files-found: error

  # tarball を npm に公開するだけ。リポジトリを取り出さず、依存も入れず、スクリプトも走らせない
  publish:
    needs: build
    runs-on: ubuntu-latest
    # 環境 npm: リポジトリの Settings → Environments で「Required reviewers」を付けると、公開の前に人の承認を挟める
    environment: npm
    permissions:
      # build ジョブの成果物 (tarball) を取るのに要る
      actions: read
      # GitHub Actions の OIDC のトークンを npm へ渡すのに要る
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - name: tarball を取る
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name package
      # prepublishOnly (検査とビルド) は build ジョブで済ませたので、スクリプトは走らせない
      - run: npm publish ./kumiori-*.tgz --ignore-scripts
