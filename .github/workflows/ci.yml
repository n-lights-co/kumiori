name: CI

on:
  pull_request:
  push:
    branches: [main]

# 検査だけなので、リポジトリを読む権限だけにする (GITHUB_TOKEN の権限を、リポジトリの既定に任せない)
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fonts
          # テストが取得する書体 (既定の書体・数式の書体と、テスト用の WOFF2・OTF)。一覧は src/fontMapping.ts と test/helpers.ts と scripts/conformance-fonts.mjs (対応仕様説明書の見本の書体) にある。
          # actions/cache は、同じキーのキャッシュを上書きしない。キーを固定にすると、最初に保存した後に増えた書体は、毎回ネットワークから取ることになるので、
          # 一覧の載るファイルのハッシュをキーに入れる (一覧が変わればキーが変わり、古いキャッシュ (restore-keys) から始めて、増えた分を足して保存し直す)
          key: fonts-test-${{ hashFiles('src/fontMapping.ts', 'test/helpers.ts', 'scripts/conformance-fonts.mjs') }}
          restore-keys: |
            fonts-test-
            fonts-defaults-v1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/unicode
          # テストが取得する Unicode の公式の適合試験 (LineBreakTest.txt・BidiTest.txt・BidiCharacterTest.txt)。版と取得は test/ucdTestData.ts にある。
          # 版が変わればキーが変わり、古いキャッシュ (restore-keys) から始めて、新しい版の分を足して保存し直す
          key: unicode-test-${{ hashFiles('test/ucdTestData.ts') }}
          restore-keys: |
            unicode-test-
      # 出来た PDF の検査の軽い組 (test/pdfChecks.test.ts) の道具。veraPDF の検査は、下の pdf のジョブで (ここでは、置き場に無いので飛ばす)
      - run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils
      - run: npm run build
      # ライブラリとしてのビルド (dist-lib。ES モジュールと型の宣言) と、ブラウザで単体で動くバンドル (dist-browser)
      - run: npm run build:lib
      - run: npm run build:browser
      # npm test は、Node のコマンド (dist-cli) も作って試す
      - run: npm test

  # 動かせる Node の下限 (package.json の engines の 22.12.0) でも、型の検査と単体のテスト (Node のコマンドのビルドと、
  # require('kumiori') で読めることの確かめを含む) を通す。ビルドの出力の確かめと e2e は、上の Node 22 のジョブだけ
  node-min:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fonts
          key: fonts-test-${{ hashFiles('src/fontMapping.ts', 'test/helpers.ts', 'scripts/conformance-fonts.mjs') }}
          restore-keys: |
            fonts-test-
            fonts-defaults-v1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/unicode
          key: unicode-test-${{ hashFiles('test/ucdTestData.ts') }}
          restore-keys: |
            unicode-test-
      - run: npm run typecheck
      # require() で読む確かめ (test/package.test.ts) は、ライブラリのビルド (dist-lib) を読む
      - run: npm run build:lib
      - run: npm run build:browser
      - run: npm test

  # ブラウザでの結合テスト (画面の組版・XSL-FO の読み込み・PDF の出力)
  e2e:
    runs-on: ubuntu-latest
    env:
      # ブラウザが Google Fonts の配信元から取った書体を覚えておく場所 (e2e/fontCache.ts)。下の actions/cache で持ち越す
      KUMIORI_E2E_FONT_CACHE: ${{ github.workspace }}/.cache/e2e-fonts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/e2e-fonts
          # 画面が取る書体は src/fontMapping.ts の一覧、ほかに e2e のテストが読ませる文書の書体。どちらかが変わればキーが変わり、
          # 古いキャッシュ (restore-keys) から始めて、増えた分を足して保存し直す
          key: fonts-e2e-${{ hashFiles('src/fontMapping.ts', 'e2e/**') }}
          restore-keys: |
            fonts-e2e-
      # ブラウザで単体で動くバンドル (dist-browser) も e2e で読んで試す
      - run: npm run build:browser
      - run: npm run e2e

  # 組み直しの再利用の確かめ (createTypesetter の使い回し・前の組版と繋ぐ所・続きから組む作り・遅く戻る試し)。リポジトリの文書の全部で、
  # 初めから使い回さずに組んだ結果と違えば落とす (速い組は npm test に入っている)。外の見本では確かめない。
  # 1 つのプロセスが大きな文書で 4GB ほどになるので、同時に組む数は 3 (ubuntu-latest のメモリは 16GB)
  relayout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fonts
          key: fonts-test-${{ hashFiles('src/fontMapping.ts', 'test/helpers.ts', 'scripts/conformance-fonts.mjs') }}
          restore-keys: |
            fonts-test-
            fonts-defaults-v1
      - run: node scripts/check-relayout.mjs --only conformance,examples,samples,generated --subjects reuse,splice-verify --jobs 3
      - run: node scripts/check-resume.mjs --only conformance,examples,samples,generated --jobs 3 --no-build
      - run: node scripts/check-resume.mjs --late 4 --only conformance,examples,samples,generated --jobs 3 --no-build

  # 意図した変化の一覧 (test/intended-changes.json) を空にしたコミットと組み比べ、一覧に無い文書・ページの変化があれば落とす
  # (リポジトリの文書の全部。前のコミットを取り出すので、履歴を全部取る)
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fonts
          key: fonts-test-${{ hashFiles('src/fontMapping.ts', 'test/helpers.ts', 'scripts/conformance-fonts.mjs') }}
          restore-keys: |
            fonts-test-
            fonts-defaults-v1
      - run: node scripts/compare-base.mjs --intended --only conformance,examples,samples,generated --jobs 4

  # 出来た PDF の検査 (リポジトリの文書を PDF/UA-1・PDF/A・PDF/X で組み、qpdf --check・Poppler・veraPDF で検査する。
  # veraPDF の落ちた規則は test/pdf-checks.json の基準と比べ、基準に無い規則が落ちたら落とす)。外の見本では確かめない
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fonts
          key: fonts-test-${{ hashFiles('src/fontMapping.ts', 'test/helpers.ts', 'scripts/conformance-fonts.mjs') }}
          restore-keys: |
            fonts-test-
            fonts-defaults-v1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/verapdf
          # veraPDF の jar (版と SHA-256 は scripts/verapdf-lib.mjs にある。版を上げればキーが変わる)
          key: verapdf-${{ hashFiles('scripts/verapdf-lib.mjs') }}
      # veraPDF を Maven Central から取る (置き場にあれば取り直さない)。Java は ubuntu-latest に入っているものを使う
      - run: node scripts/verapdf.mjs --fetch-only
      - run: node scripts/check-pdfs.mjs --only conformance,examples,samples --jobs 3
