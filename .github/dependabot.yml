# GitHub Actions の Action は、コミットの SHA で固定している (.github/workflows/*.yml の `uses: owner/name@<SHA> # vX.Y.Z`)。
# タグは後から別のコミットへ付け替えられるので、公開の権限を持つワークフローで別のコードが動かないようにするため。
# 新しい版が出たら、Dependabot が SHA と版のコメントを一緒に上げる PR を作る。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  # npm の依存 (実行時の依存は @pdf-lib/fontkit・@xmldom/xmldom・htmlparser2・hyphen・linkedom・pako・pdf-lib・roughjs・utif。どれも、他人の書いた文書・画像・書体を読んで組み、描く所)。
  # 脆弱性の修正の版は、Dependabot の security updates が、下の設定とは別に、すぐに PR にする (リポジトリの Settings → Code security で有効にしておく)。
  # 版の上げは、週に 1 度、開発用の依存 (vite・vitest・typescript・playwright など) と実行時の依存を、別々の PR にまとめる
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
      runtime-dependencies:
        dependency-type: production
    # htmlparser2 は、linkedom の依存の版と合わせる。主な版の上げ (htmlparser2 の 11 以上) を PR にしない。
    # 直下の依存の htmlparser2 は、linkedom が使う構文解析器 (Parser) に仕掛けを入れるため (src/htmlParserStack.ts・src/sourceLocation.ts) だけにあり、
    # linkedom と違う版にすると、仕掛けが linkedom の使わない Parser に入って効かなくなる (linkedom 0.18.15 は htmlparser2 ^10.1.0 を使う)。
    # linkedom が htmlparser2 を上げたら、その版に合わせて上げ、htmlParserStack.ts・sourceLocation.ts が新しい Parser の作りに合うかを確かめ、ここの項を外す。
    # 小さな版・修正の版の上げと、脆弱性の修正 (security updates) は、これまでどおり受ける。
    ignore:
      - dependency-name: htmlparser2
        update-types: ['version-update:semver-major']
  # API の説明書を作る道具 (tools/api-docs。TypeDoc と、それが使う TypeScript)。npm のパッケージには入らない
  # (GitHub Pages の API の説明書には、TypeDoc の頁の JavaScript・CSS が入る。THIRD_PARTY_NOTICES.md の 14 節)。
  # TypeDoc 0.28 は TypeScript 6.0 までにしか対応していないので、TypeScript の 6.1 以上への上げ (主な版・小さな版) を PR にしない。
  # TypeDoc が TypeScript 7 に対応したら、TypeDoc を上げるコミットで、ここの ignore も一緒に外す (直下の依存に移せるかも考える)。
  - package-ecosystem: npm
    directory: /tools/api-docs
    schedule:
      interval: weekly
    groups:
      api-docs:
        patterns: ['*']
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
