<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kumiori 印刷プレビューの見本</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /* 左に編集欄と印刷の CSS、右に組んだページ。Kumiori の公開 API (createTypesetter・renderPage) だけを使う */
      :root { color-scheme: light; --line: #d9dde3; --muted: #5f6773; --desk: #eceef1; --accent: #1b3a5c; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; font-family: system-ui, 'Noto Sans JP', sans-serif; font-size: 14px; color: #1d232b; background: #fff; }
      header { height: 48px; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--line); }
      header h1 { font-size: 15px; margin: 0; }
      #status { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
      .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: calc(100% - 48px); }
      .edit { display: flex; flex-direction: column; border-right: 1px solid var(--line); min-height: 0; }
      #editor { flex: 1; overflow: auto; padding: 20px 24px; outline: none; line-height: 1.8; }
      #editor:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
      #editor table { border-collapse: collapse } #editor th, #editor td { border: 1px solid var(--line); padding: 2px 8px }
      #editor rt { color: var(--accent); }
      details { border-top: 1px solid var(--line); }
      summary { padding: 8px 16px; cursor: pointer; color: var(--muted); }
      #source, #css { width: 100%; height: 160px; border: 0; border-top: 1px solid var(--line); padding: 10px 16px; font: 12.5px/1.5 ui-monospace, Menlo, monospace; resize: vertical; }
      #preview { overflow: auto; background: var(--desk); padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
      #preview canvas { background: #fff; box-shadow: 0 2px 10px rgba(0, 0, 0, .18); }
      #warnings { color: #8a5a00; font-size: 12px; max-width: 60ch; }
      @media (max-width: 760px) { .layout { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } .edit { border-right: 0; border-bottom: 1px solid var(--line); } }
    </style>
  </head>
  <body>
    <header>
      <h1>印刷プレビューの見本</h1>
      <span id="status" role="status">書体を読み込んでいます…</span>
    </header>
    <div class="layout">
      <section class="edit" aria-label="編集">
        <div id="editor" contenteditable="true">
          <h1>組み織り</h1>
          <p>ここを書き換えると、手が止まったところで右のプレビューが組み直されます。見出し・ルビ・表などは、下の「HTML」で直接書けます。</p>
          <h2>ルビと禁則</h2>
          <p><ruby>吾輩<rt>わがはい</rt></ruby>は猫である。名前はまだ無い。どこで生れたかとんと見当がつかぬ。何でも薄暗いじめじめした所でニャーニャー泣いていた事だけは記憶している。</p>
          <h2>表</h2>
          <table><tr><th>項目</th><th>内容</th></tr><tr><td>用紙</td><td>A5</td></tr><tr><td>余白</td><td>15mm</td></tr></table>
        </div>
        <details>
          <summary>HTML (編集欄の中身。書き換えると編集欄にも反映)</summary>
          <textarea id="source" spellcheck="false" aria-label="HTML"></textarea>
        </details>
        <details>
          <summary>印刷の CSS (用紙・余白・柱・改ページ)</summary>
          <textarea id="css" spellcheck="false">@page {
  size: A5;
  margin: 15mm;
  @bottom-center { content: counter(page) " / " counter(pages); font-size: 8pt }
}
body { font-family: serif; font-size: 10pt; line-height: 1.7 }
h1 { font-size: 18pt }
h2 { font-size: 12pt; break-after: avoid }
table { border-collapse: collapse }
th, td { border: 0.5pt solid #888; padding: 2pt 6pt }</textarea>
        </details>
      </section>
      <section id="preview" aria-label="印刷プレビュー">
        <div id="warnings"></div>
      </section>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
